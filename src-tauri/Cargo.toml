[package]
name = "shelf"
version = "1.0.1"
description = "A small, secure SFTP transfer client"
authors = ["Shelf contributors"]
edition = "2021"

[lib]
name = "shelf_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util"] }
# The SFTP service will be implemented here once the native toolchain is installed.
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "3.0"
